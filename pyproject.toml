[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bim-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for bim.com.tr (BİM discount grocery): weekly Aktüel deals, prices, categories, provinces"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
bim-mcp = "bim_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bim_mcp"]
